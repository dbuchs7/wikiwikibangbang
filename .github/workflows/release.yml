name: Release

# Cut a release by pushing a semver tag:
#
#   git tag -a v0.1.0 -m "wikiwikibangbang v0.1.0" && git push origin v0.1.0
#
# This builds the single binary for every supported platform (ADR-0024),
# stamps the tag into the version string via -ldflags, and publishes a GitHub
# Release with the archives and a SHA256SUMS file. The binary is pure Go with
# no CGO and embeds the web UI, so every target cross-compiles from the linux
# runner.
#
# A release can also be started on GitHub, without git: Releases -> Draft a
# new release -> a new tag v… -> Publish. GitHub then creates the tag, this
# workflow runs, and the archives are attached to the release that already
# exists instead of creating a second one.
#
# workflow_dispatch without a tag builds the artifacts for a dry run and
# publishes nothing. With a tag (e.g. v0.1.0) it builds that tag and attaches
# the archives to its release — the way to complete a release whose archives
# are missing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the archives to the release of this existing tag, e.g. v0.1.0; leave empty for a dry run'
        required: false
        default: ''

permissions:
  contents: read

# The tag to build and publish: the pushed one, or the one given to a manual
# run; empty for a dry run.
env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # 32-bit ARM, e.g. Raspberry Pi on a 32-bit OS. GOARM=6 is the lowest
          # common denominator, so one binary runs on every Pi.
          - { goos: linux, goarch: arm, goarm: '6' }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      # Refuses anything but a version tag before it reaches a shell or a ref.
      - name: Check the tag
        run: |
          set -euo pipefail
          if [ -n "${TAG}" ] && ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${TAG} is not a version tag such as v0.1.0"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # The version is the tag without the leading "v"; a manual dispatch
          # (no tag) stamps a dev string so the dry run still carries one.
          if [ -n "${TAG}" ]; then
            version="${TAG#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA::12}"
          fi
          ldflags="-s -w -X github.com/dbuchs7/wikiwikibangbang/internal/buildinfo.Version=${version}"

          bin="wikiwikibangbang"
          if [ "${GOOS}" = "windows" ]; then bin="wikiwikibangbang.exe"; fi
          go build -trimpath -ldflags "${ldflags}" -o "${bin}" ./cmd/wikiwikibangbang

          name="wikiwikibangbang_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}" out
          cp "${bin}" LICENSE README.md THIRD_PARTY_NOTICES.md "dist/${name}/"
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -qr "../out/${name}.zip" "${name}")
          else
            tar -czf "out/${name}.tar.gz" -C dist "${name}"
          fi
          (cd out && sha256sum * > "${name}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: wikiwikibangbang-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          retention-days: 7

  release:
    name: publish release
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      # A release made on GitHub's release page exists before this runs: its
      # tag is what started the workflow. Then the archives are attached to it
      # (replacing any of the same name), and its title, notes and prerelease
      # flag stay as written there. Otherwise the release is created; every
      # 0.x tag is a prerelease, nothing before 1.0 is stable.
      - name: Publish the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber artifacts/*
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "wikiwikibangbang ${TAG}" --generate-notes --prerelease \
              artifacts/*
          fi
