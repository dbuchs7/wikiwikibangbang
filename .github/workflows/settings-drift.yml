name: Settings drift

# ADR-0003: the repository settings on GitHub are click settings; this job
# compares them once a day with .github/repository-settings.json and
# .github/rulesets/*.json, so a change made on GitHub alone shows up as a red
# run instead of going unnoticed. It is not a pull request check: a pull
# request that changes the files is merged first and applied on GitHub
# afterwards, and the next run confirms it.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: repository settings match the files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The default token cannot read the merge settings or the ruleset's
      # bypass list (first run, 2026-10-19). SETTINGS_READ_TOKEN is a
      # fine-grained token limited to this repository with "Administration:
      # read", expected to read every value; -strict then turns an
      # unreadable one into a failure, so an expired or weakened token shows
      # up as a red run. Without the secret the job falls back to the default
      # token and only warns.
      - name: compare settings and rulesets with GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.SETTINGS_READ_TOKEN || github.token }}
          STRICT: ${{ secrets.SETTINGS_READ_TOKEN != '' }}
        run: go run ./cmd/settingscheck -repo "$GITHUB_REPOSITORY" -strict="$STRICT"
