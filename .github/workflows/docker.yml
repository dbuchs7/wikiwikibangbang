name: Container image

# Builds the single-binary server image (ADR-0024). On pull requests it builds
# only, which validates the Dockerfile; on pushes to main and on version tags it
# also pushes a multi-arch image to the GitHub Container Registry
# (ghcr.io/<owner>/<repo>).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'internal/web/static/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: build · push (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tags are needed to name a build after the release it is.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build; forks have no write access to the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # A release is named by its tag; a build of main on a released commit
      # by that release too; any other build by the last release, the
      # commits since and its commit, e.g. 0.5.4+3.g75672f2.
      - name: Version for the binary
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif tag="$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null)"; then
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          elif described="$(git describe --tags --match 'v[0-9]*' 2>/dev/null)"; then
            # v0.5.4-3-g75672f2 -> 0.5.4+3.g75672f2
            base="${described%-*-g*}"; rest="${described#"${base}"-}"
            echo "value=${base#v}+${rest%%-*}.${rest#*-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests build and load the amd64 image and start it once; pushes
      # build every platform and publish.
      - name: Build (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wikiwikibangbang:ci
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker run --rm wikiwikibangbang:ci version
          docker run -d --name wwbb -p 8080:8080 -e WWBB_ADMIN_PASSWORD=ci-admin-password wikiwikibangbang:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          docker exec wwbb /wikiwikibangbang healthcheck
          docker exec wwbb /wikiwikibangbang check -data-dir /data
          # The API refuses anonymous callers and accepts the administrator.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me)" = 401
          curl -fsS -c /tmp/cookies -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' http://127.0.0.1:8080/api/login
          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/api/me
          # Write an item, restart the container, read it back.
          j='Content-Type: application/json'
          curl -fsS -b /tmp/cookies -H "$j" -d '{"key":"CI","name":"CI"}' http://127.0.0.1:8080/api/spaces
          curl -fsS -b /tmp/cookies -H "$j" -d '{"name":"page","body":true,"fields":[]}' http://127.0.0.1:8080/api/types
          curl -fsS -b /tmp/cookies -H "$j" -d '{"space":"CI","type":"page","title":"survives"}' http://127.0.0.1:8080/api/items
          docker restart wwbb
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -c /tmp/cookies -H "$j" -d '{"username":"admin","password":"ci-admin-password"}' http://127.0.0.1:8080/api/login
          curl -fsS -b /tmp/cookies http://127.0.0.1:8080/api/items/CI-1 | grep -q '"title":"survives"'
          docker logs wwbb
          docker rm -f wwbb
          [ "${ok:-0}" = 1 ]

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
