name: CI

on:
  push:
  pull_request:
    branches: [main]
    # `edited` re-runs the checks when the description changes, so a
    # Signed-off-by line added to it is picked up (ADR-0018).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: fmt · vet · test (race)
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # ADR-0004: the product builds without CGO. The race detector below
      # needs CGO, so this is a separate step.
      - name: go build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      # Includes the ADR consistency tests in docs/adr and the DCO rule tests.
      - name: go test -race
        run: go test -race ./...

  dco:
    name: DCO sign-off (humans only)
    # The rule applies to what is proposed for merge; agent commits on a work
    # branch are expected to be unsigned until the responsible person signs
    # off, on the commits or once in the pull request description (ADR-0018).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base of the pull request is present.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The description is passed through the environment and a file, never
      # interpolated into the script, so its text cannot run as shell code.
      #
      # DCO_MODE is `advisory` while enforcement is suspended (ADR-0019): the
      # job reports missing sign-offs as a warning and passes. Switching it to
      # `enforce` is a decision of the maintainer, recorded by superseding
      # ADR-0019 — never an agent's own change.
      - name: Check sign-offs
        env:
          DCO_MODE: advisory
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          mode_flag=""
          if [ "$DCO_MODE" = "advisory" ]; then mode_flag="-advisory"; fi
          go run ./cmd/dcocheck $mode_flag -pr-body-file "$RUNNER_TEMP/pr-body.txt" "$BASE_SHA" "$HEAD_SHA"
