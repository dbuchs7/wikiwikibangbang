name: CI

on:
  push:
  pull_request:
    branches: [main]
    # `edited` re-runs the checks when the description changes, so a
    # Signed-off-by line added to it is picked up (ADR-0018).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: fmt · vet · test (race)
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # ADR-0004: the product builds without CGO. The race detector below
      # needs CGO, so this is a separate step.
      - name: go build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./...

      # Includes the ADR consistency tests in docs/adr and the DCO rule tests.
      - name: go test -race
        run: go test -race ./...

      # ADR-0005: one repository-wide statement-coverage number, floor 90%.
      # One profile from one run lists each block once, so the number is
      # reproducible. The floor is an alarm, not a target; it is changed only
      # by amending ADR-0005.
      - name: coverage floor (90%)
        run: |
          go test -coverprofile="$RUNNER_TEMP/cover.out" ./... > /dev/null
          total="$(go tool cover -func="$RUNNER_TEMP/cover.out" | awk '/^total:/ { sub("%", "", $3); print $3 }')"
          awk -v total="$total" -v floor=90 'BEGIN {
            printf "statement coverage %s%% (floor %s%%)\n", total, floor
            if (total + 0 < floor) exit 1
          }'

  # ADR-0024: the single binary builds for every release platform. Cheap
  # enough to run on every push, so a platform-specific break shows up before
  # a release tag does. internal/repoconfig keeps this list equal to the
  # release matrix.
  cross-build:
    name: cross-build (release platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build for every platform
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::${target}"
            GOOS="${target%/*}" GOARCH="${target#*/}" GOARM=6 \
              go build -trimpath -o /dev/null ./cmd/wikiwikibangbang
            echo "::endgroup::"
          done

  # ADR-0031: the embedded UI, driven in Chromium against the real binary.
  e2e:
    name: e2e (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the UI smoke test against the binary
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/wwbb" ./cmd/wikiwikibangbang
          WWBB_ADMIN_PASSWORD=e2e-admin-password "$RUNNER_TEMP/wwbb" serve -addr 127.0.0.1:8080 -data-dir "$RUNNER_TEMP/data" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          cd e2e && BASE_URL=http://127.0.0.1:8080 ADMIN_PASSWORD=e2e-admin-password node smoke.cjs

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e/failure.png
            ${{ runner.temp }}/server.log
          retention-days: 7

  dco:
    name: DCO sign-off (humans only)
    # The rule applies to what is proposed for merge; agent commits on a work
    # branch are expected to be unsigned until the responsible person signs
    # off, on the commits or once in the pull request description (ADR-0018).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base of the pull request is present.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The description is passed through the environment and a file, never
      # interpolated into the script, so its text cannot run as shell code.
      #
      # DCO_MODE is `advisory` while enforcement is suspended (ADR-0019): the
      # job reports missing sign-offs as a warning and passes. Switching it to
      # `enforce` is a decision of the maintainer, recorded by superseding
      # ADR-0019 — never an agent's own change.
      - name: Check sign-offs
        env:
          DCO_MODE: advisory
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          mode_flag=""
          if [ "$DCO_MODE" = "advisory" ]; then mode_flag="-advisory"; fi
          go run ./cmd/dcocheck $mode_flag -pr-body-file "$RUNNER_TEMP/pr-body.txt" "$BASE_SHA" "$HEAD_SHA"
