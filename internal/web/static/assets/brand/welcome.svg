<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t">
  <title id="t">A team's knowledge hub: a page with a board at the centre, linked to conversations, tasks, pictures and protection, and the people working on it</title>
  <!-- The welcome illustration of the start page: no text, no external resources. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c9dff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#a78bfa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#0b5cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe6ff"/>
      <stop offset="1" stop-color="#efe7ff"/>
    </linearGradient>
    <linearGradient id="link" x1="0" x2="1">
      <stop offset="0" stop-color="#0b5cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity=".55"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e2a55" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- glow and orbit -->
  <circle cx="240" cy="166" r="168" fill="url(#glow)"/>
  <ellipse cx="240" cy="168" rx="196" ry="118" fill="none" stroke="#9fb4ff" stroke-width="1.5" stroke-dasharray="3 7" opacity=".7"/>

  <!-- links from the page to the four nodes -->
  <g fill="none" stroke="url(#link)" stroke-width="2.5" stroke-linecap="round">
    <path d="M150 112 C110 92 92 78 76 66"/>
    <path d="M330 104 C372 86 392 76 410 64"/>
    <path d="M150 226 C110 246 92 254 74 262"/>
    <path d="M330 232 C372 250 394 258 412 266"/>
  </g>

  <!-- the browser window with a page and a board -->
  <g filter="url(#lift)">
    <rect x="140" y="70" width="200" height="190" rx="16" fill="#ffffff"/>
    <rect x="140" y="70" width="200" height="30" rx="16" fill="#f1f4fb"/>
    <rect x="140" y="88" width="200" height="12" fill="#f1f4fb"/>
    <circle cx="158" cy="85" r="4.5" fill="#f87171"/>
    <circle cx="172" cy="85" r="4.5" fill="#fbbf24"/>
    <circle cx="186" cy="85" r="4.5" fill="#34d399"/>
    <rect x="202" y="80" width="120" height="10" rx="5" fill="#e3e8f4"/>
    <!-- a picture on the page -->
    <rect x="156" y="112" width="168" height="54" rx="10" fill="url(#hero)"/>
    <path d="M164 160 L196 132 L216 150 L232 138 L262 160 Z" fill="#9db5ff"/>
    <circle cx="292" cy="130" r="9" fill="#fcd34d"/>
    <!-- heading and lines -->
    <rect x="156" y="176" width="96" height="9" rx="4.5" fill="url(#bar)"/>
    <rect x="156" y="191" width="140" height="6" rx="3" fill="#dfe5f1"/>
    <!-- a little board: three columns with cards -->
    <rect x="156" y="206" width="50" height="42" rx="7" fill="#f5f7fc"/>
    <rect x="215" y="206" width="50" height="42" rx="7" fill="#f5f7fc"/>
    <rect x="274" y="206" width="50" height="42" rx="7" fill="#f5f7fc"/>
    <rect x="161" y="212" width="40" height="11" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="161" y="228" width="40" height="11" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
    <rect x="220" y="212" width="40" height="11" rx="4" fill="#ffffff" stroke="#fcd9a8"/>
    <rect x="279" y="212" width="40" height="11" rx="4" fill="#ffffff" stroke="#a7e3c2"/>
    <path d="M285 217.5 l3 3 6-6" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- node: conversation (top left) -->
  <g filter="url(#lift)">
    <circle cx="66" cy="58" r="30" fill="#ffffff"/>
    <path d="M50 46 h32 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-18 l-8 7 v-7 h-6 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z" fill="#0b5cff"/>
    <circle cx="58" cy="59" r="2.6" fill="#ffffff"/>
    <circle cx="66" cy="59" r="2.6" fill="#ffffff"/>
    <circle cx="74" cy="59" r="2.6" fill="#ffffff"/>
  </g>
  <!-- node: tasks (top right) -->
  <g filter="url(#lift)">
    <circle cx="418" cy="56" r="30" fill="#ffffff"/>
    <rect x="402" y="40" width="32" height="32" rx="7" fill="#14b8a6"/>
    <path d="M409 56 l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- node: pictures and drawings (bottom left) -->
  <g filter="url(#lift)">
    <circle cx="64" cy="268" r="30" fill="#ffffff"/>
    <rect x="47" y="253" width="34" height="28" rx="6" fill="#f59e0b"/>
    <path d="M50 278 l9-9 7 6 5-4 8 7 z" fill="#ffffff"/>
    <circle cx="72" cy="261" r="3.5" fill="#ffffff"/>
  </g>
  <!-- node: protection (bottom right) -->
  <g filter="url(#lift)">
    <circle cx="420" cy="272" r="30" fill="#ffffff"/>
    <path d="M420 254 l15 6 v10 c0 9 -6.5 15.5 -15 18 c-8.5 -2.5 -15 -9 -15 -18 v-10 z" fill="#7c5cff"/>
    <path d="M413 271 l5 5 9 -9" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- people working together -->
  <g filter="url(#lift)">
    <circle cx="352" cy="164" r="17" fill="#fde68a" stroke="#ffffff" stroke-width="3"/>
    <circle cx="352" cy="159" r="6" fill="#b45309"/>
    <path d="M341 175 a11 9 0 0 1 22 0" fill="#b45309"/>
    <circle cx="128" cy="170" r="17" fill="#bfdbfe" stroke="#ffffff" stroke-width="3"/>
    <circle cx="128" cy="165" r="6" fill="#1d4ed8"/>
    <path d="M117 181 a11 9 0 0 1 22 0" fill="#1d4ed8"/>
    <circle cx="372" cy="196" r="13" fill="#fbcfe8" stroke="#ffffff" stroke-width="3"/>
    <circle cx="372" cy="192" r="4.5" fill="#be185d"/>
    <path d="M364 204 a8 7 0 0 1 16 0" fill="#be185d"/>
  </g>
  <!-- a live cursor on the page -->
  <path d="M300 140 l0 20 5 -5 4 9 4 -2 -4 -9 7 0 z" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M232 18 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5 z" fill="#7c5cff"/>
  <path d="M460 160 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#14b8a6"/>
  <path d="M20 150 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#f59e0b"/>
  <circle cx="300" cy="22" r="4" fill="#f43f5e" opacity=".8"/>
  <circle cx="176" cy="300" r="5" fill="#0b5cff" opacity=".5"/>
  <circle cx="318" cy="304" r="3.5" fill="#14b8a6" opacity=".8"/>
  <circle cx="110" cy="20" r="3" fill="#7c5cff" opacity=".6"/>
</svg>
