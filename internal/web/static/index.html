<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wikiwikibangbang</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <!-- the start page's picture, addressed by its content as the icons are -->
  <meta name="wwbb-welcome" content="/assets/brand/welcome.svg">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/theme-dark.css" media="screen and (prefers-color-scheme: dark)" id="dark-css">
  <script src="/assets/theme-boot.js"></script>
  <link rel="stylesheet" href="/branding.css" id="branding-css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header class="top">
    <button id="app-switcher" class="icon-btn grid" type="button" title="Modules" aria-label="Modules" aria-expanded="false" aria-controls="drawer" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/>
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        <circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/>
      </svg>
    </button>
    <span id="history-nav" class="history-nav" hidden>
      <a id="nav-home" class="icon-btn" href="#/" title="Home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button id="nav-back" class="icon-btn" type="button" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="nav-forward" class="icon-btn" type="button" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <a class="brand" href="#/">
      <picture>
        <source srcset="/assets/brand/logo-white.svg" media="(prefers-color-scheme: dark)">
        <img src="/assets/brand/logo-black.svg" alt="wikiwikibangbang" width="131" height="40">
      </picture>
    </a>
    <nav id="nav"></nav>
  </header>
  <!-- The module switcher: a drawer from the left, opened by the nine dots. -->
  <div id="scrim" hidden></div>
  <aside id="drawer" hidden aria-label="Modules">
    <div class="drawer-head">
      <button id="drawer-close" class="icon-btn" type="button" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <img src="/assets/brand/favicon.svg" alt="" width="20" height="20"> <b>wikiwikibangbang</b>
    </div>
    <nav id="drawer-apps" aria-label="Modules"></nav>
  </aside>
  <main id="app"><p class="muted">Loading…</p></main>
  <footer id="footer" class="footer"></footer>
  <noscript>This application needs JavaScript.</noscript>
</body>
</html>
